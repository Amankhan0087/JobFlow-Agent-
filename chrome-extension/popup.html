<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JobFlow Agent</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      background: #0A0F1E;
      color: #F9FAFB;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
    }

    .header {
      background: linear-gradient(135deg, #111827, #1A2234);
      padding: 16px 18px;
      border-bottom: 1px solid #1F2937;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo { font-size: 15px; font-weight: 700; color: #2DD4BF; }
    .logo span { color: #6366F1; }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #EF4444;
      transition: background 0.3s;
    }
    .status-dot.online { background: #10B981; }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: #1F2937;
      border-bottom: 1px solid #1F2937;
    }
    .stat {
      background: #111827;
      padding: 14px 16px;
      text-align: center;
    }
    .stat-val { font-size: 22px; font-weight: 700; color: #F9FAFB; }
    .stat-val.teal { color: #2DD4BF; }
    .stat-val.indigo { color: #6366F1; }
    .stat-val.amber { color: #F59E0B; }
    .stat-val.green { color: #10B981; }
    .stat-label { font-size: 10px; color: #6B7280; margin-top: 3px; }

    .section { padding: 14px 18px; border-bottom: 1px solid #1F2937; }
    .section-title { font-size: 11px; font-weight: 600; color: #6B7280; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }

    .quick-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .action-btn {
      flex: 1; min-width: 80px;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid #1F2937;
      background: #1A2234;
      color: #9CA3AF;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .action-btn:hover { border-color: #2DD4BF; color: #2DD4BF; background: rgba(45,212,191,0.08); }
    .action-btn.primary { background: #2DD4BF; color: #0A0F1E; border-color: #2DD4BF; }
    .action-btn.primary:hover { background: #14B8A6; }

    .market-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .market-chip {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      background: rgba(99,102,241,0.15);
      color: #6366F1;
      border: 1px solid rgba(99,102,241,0.3);
    }

    .status-bar {
      padding: 10px 18px;
      background: #0D1526;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-text { font-size: 11px; color: #4B5563; }
    .status-text.online { color: #10B981; }
    .open-dashboard {
      margin-left: auto;
      font-size: 11px;
      color: #2DD4BF;
      cursor: pointer;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="header">
  <div class="logo">⚡ JobFlow <span>Agent</span></div>
  <div class="status-dot" id="statusDot"></div>
</div>

<div class="stats-grid">
  <div class="stat">
    <div class="stat-val indigo" id="statApplied">—</div>
    <div class="stat-label">Applied</div>
  </div>
  <div class="stat">
    <div class="stat-val amber" id="statInterviews">—</div>
    <div class="stat-label">Interviews</div>
  </div>
  <div class="stat">
    <div class="stat-val teal" id="statScraped">—</div>
    <div class="stat-label">Jobs Found</div>
  </div>
  <div class="stat">
    <div class="stat-val green" id="statOffers">—</div>
    <div class="stat-label">Offers</div>
  </div>
</div>

<div class="section">
  <div class="section-title">Quick Actions</div>
  <div class="quick-actions">
    <button class="action-btn primary" id="btnScrape">🔍 Scrape Jobs</button>
    <button class="action-btn" id="btnMatch">🎯 Match Score</button>
    <button class="action-btn" id="btnApply">🤖 Auto Apply</button>
    <button class="action-btn" id="btnFollowup">📧 Follow Up</button>
  </div>
</div>

<div class="section">
  <div class="section-title">Active Markets</div>
  <div class="market-list">
    <span class="market-chip">🇦🇪 UAE</span>
    <span class="market-chip">🇬🇧 UK</span>
    <span class="market-chip">🇸🇦 SA</span>
    <span class="market-chip">🇩🇪 Germany</span>
    <span class="market-chip">🇺🇸 USA</span>
  </div>
</div>

<div class="status-bar">
  <div class="status-dot" id="statusDot2" style="width:6px;height:6px"></div>
  <span class="status-text" id="statusText">Checking API...</span>
  <a class="open-dashboard" id="openDashboard" href="#">Open Dashboard →</a>
</div>

<script src="popup.js"></script>
</body>
</html>
